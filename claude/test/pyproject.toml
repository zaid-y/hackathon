[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thaillm-rag"
version = "1.0.0"
description = "ThaiLLM RAG Pipeline with Prompt Enhancement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.0",
]

[project.optional-dependencies]
vector = ["sentence-transformers>=2.2.0"]
api = ["fastapi>=0.100.0", "uvicorn>=0.23.0"]
ui = ["streamlit>=1.25.0"]
docs = ["pdfplumber>=0.10.0", "python-docx>=1.1.0", "beautifulsoup4>=4.12.0"]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["thaillm_rag*"]